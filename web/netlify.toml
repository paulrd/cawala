# Netlify build + header settings for the Cawala web app.
#
# Netlify uses FIRST-MATCH header semantics, so a catch-all placed first would
# shadow the per-path cache rules. We therefore keep Netlify's headers here
# (assets first, catch-all last) and remove the shared web/public/_headers from
# the publish dir so it cannot shadow these. Cloudflare Pages keeps using
# _headers; each host has exactly one source of truth.
#
# In the Netlify UI set the site's "Base directory" to `web`, or deploy from
# web/ with:  netlify deploy --build
[build]
  command = "npm ci && npm run build && rm -f dist/_headers"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' blob: https://dns.iroh.link https://*.relay.n0.iroh.link wss://*.relay.n0.iroh.link; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "no-cache"
