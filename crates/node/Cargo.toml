[package]
name = "cawala-node"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.86"
cawala-topology = { path = "../topology" }
clap = { version = "4.5.30", features = ["derive"] }
iroh = "=1.0.3"
n0-future = "0.3"
proto = { package = "cawala-proto", path = "../proto" }
serde = "1.0.217"
serde_json = "1.0.150"
thiserror = "2.0"
tokio = { version = "1.43.0", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
