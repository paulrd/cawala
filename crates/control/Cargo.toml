[package]
name = "cawala-control"
version = "0.1.0"
edition = "2024"

[dependencies]
cawala-ledger = { path = "../ledger" }
cawala-msg = { path = "../msg" }
# For the shared `EthProof` type carried by `RegisterEthAddress`. `bip39` is a
# browser-only feature, so the node does not link the mnemonic machinery.
cawala-eth = { path = "../eth", default-features = false }
cawala-topology = { path = "../topology" }
blake3 = "1.8"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.217", features = ["derive"] }
thiserror = "2.0"
url = "2.5"

[dev-dependencies]
serde_json = "1.0.150"
