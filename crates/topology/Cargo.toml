[package]
name = "cawala-topology"
version = "0.1.0"
edition = "2024"

# Pure-std topology model shared by the node and (later) persisted state:
# no iroh, no tokio. Addresses come from `proto::OctAddr`.
[dependencies]
proto = { package = "cawala-proto", path = "../proto" }
serde = { version = "1.0.217", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
proptest = "1.6"
