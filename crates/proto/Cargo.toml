[package]
name = "cawala-proto"
version = "0.1.0"
edition = "2024"

# Wire-format crate shared by the native node and the WASM client.
# MUST stay wasm-safe: postcard + serde only, tokio limited to io-util.
[dependencies]
# `use-std` enables postcard's `alloc` feature, which gates `to_allocvec`;
# must be declared here so the crate builds standalone (not just via iroh).
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.217", features = ["derive"] }
tokio = { version = "1.43.0", default-features = false, features = ["io-util"] }

[dev-dependencies]
# Test-only features (macros + rt for #[tokio::test]); never compiled for
# downstream (e.g. wasm) builds of this crate.
tokio = { version = "1.43.0", default-features = false, features = ["macros", "rt"] }
